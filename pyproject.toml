[project]
name = "llm-sandbox"
version = "0.1.0"
description = "Sandbox for LLM application development: LangChain, LangGraph, Langflow, LangSmith and provider SDKs"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.12.1",
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "httpx>=0.28.1",
    "langchain>=1.3.18",
    "langchain-anthropic>=1.7.5",
    "langchain-chroma>=0.2.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.7",
    "langchain-google-genai>=4.4.0",
    "langchain-huggingface>=1.2.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.7",
    "langchain-text-splitters>=1.1.3",
    "langflow>=1.10.3",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "langgraph-cli[inmem]>=0.4.33",
    "langgraph-supervisor>=0.0.31",
    "langgraph-swarm>=0.1.0",
    "langsmith[pytest]>=0.14.4",
    "openai>=3.26.1",
    "openevals>=0.2.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.1.0",
    "tenacity>=9.1.4",
    "tiktoken>=0.14.0",
    "deepagents==0.7.0",
    "langgraph>=1.0.0,<2.0",
    "langchain>=1.0.0,<2.0",
    "langchain-core>=1.3.3,<2.0",
    "langchain-anthropic",
    "langchain-openai",
    "langgraph-cli[inmem]>=0.4.0",
    "python-dotenv",
    "langsmith[sandbox]>=0.14.14,<0.15",
    "langchain-ollama>=1.1.0",
    "langchain-community>=0.4.2",
    "deepagents-code",
    "langchain-quickjs",
    "langchain-mcp-adapters",
    "tavily-python",
    "markdown",
    "nh3",
    "matplotlib>=3.11.0",
    "questionary>=2.0.0",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

# Provider extras referenced by the install table in models.py
# (`uv sync --extra azure|bedrock|google`).
[project.optional-dependencies]
# AzureChatOpenAI ships with langchain-openai (already a core dependency);
# defining the extra keeps the documented command valid.
azure = [
    "langchain-openai",
]

[tool.ruff]
lint.select = ["E", "F", "I", "UP"]
lint.ignore = ["T201", "E501", "UP006", "UP007", "E402"]